{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ reglages.nom_boutique }}</title>
  <link rel="icon" href="{% static 'boutique/img/favicon.svg' %}" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #3F1D24; color: #F3E9D8; font-family: Inter, system-ui, sans-serif; text-align: center; padding: 2rem; box-sizing: border-box; }
    .m { display: inline-grid; place-items: center; font-family: "Source Serif 4", Georgia, serif; line-height: 1; }
    .m span { grid-area: 1/1; } .o { font-size: 96px; font-weight: 300; color: #D2B47A; } .mm { font-size: 38px; font-weight: 600; }
    h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 500; letter-spacing: .14em; font-size: 1.7rem; margin: .8rem 0 .3rem; }
    .slogan { font-family: "Source Serif 4", Georgia, serif; font-style: italic; color: #E2C993; }
    .msg { max-width: 30rem; margin: 1.6rem auto 0; line-height: 1.6; color: #E7DAC6; }
    .retour { display: inline-block; margin-top: 1.4rem; padding: .8rem 1.3rem; border: 1px solid rgba(210, 180, 122, .45); border-radius: .6rem; }
    .retour small { display: block; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: #D2B47A; margin-bottom: .25rem; }
    .retour strong { font-family: "Source Serif 4", Georgia, serif; font-weight: 500; font-size: 1.25rem; color: #fff; }
    .retour .reste { display: block; font-size: .85rem; color: #CDBFAA; margin-top: .3rem; }
    hr { width: 120px; border: 0; border-top: 1px solid #D2B47A; margin: 1rem auto; }
  </style>
</head>
<body>
  <main>
    <span class="m" aria-hidden="true"><span class="o">O</span><span class="mm">M</span></span>
    <h1>{{ reglages.nom_boutique|upper }}</h1>
    <hr>
    <p class="slogan">{{ reglages.slogan }}</p>
    <p class="msg">{{ reglages.message_maintenance }}</p>
    {% if fin_texte %}
      <div class="retour">
        <small>Retour du site prévu</small>
        <strong>{{ fin_texte|capfirst }}</strong>
        <span class="reste" id="reste" data-fin="{{ reglages.fin_maintenance|date:'c' }}"></span>
      </div>
    {% endif %}
  </main>
  {% if fin_texte %}
  <script>
    (function () {
      var el = document.getElementById("reste"), fin = new Date(el.dataset.fin).getTime();
      function maj() {
        var s = Math.round((fin - Date.now()) / 1000);
        if (s <= 0) { el.textContent = "Le site revient, actualisation…"; setTimeout(function () { location.reload(); }, 3000); return; }
        var j = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
        el.textContent = "Dans " + (j ? j + " j " : "") + (j || h ? h + " h " : "") + (j ? "" : (m || 1) + " min");
        setTimeout(maj, 30000);
      }
      maj();
    })();
  </script>
  {% endif %}
</body>
</html>
